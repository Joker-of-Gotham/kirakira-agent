services:
  postgres:
    ports:
      - "${KIRAKIRA_POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${KIRAKIRA_REDIS_PORT:-6379}:6379"

  qdrant:
    ports:
      - "${KIRAKIRA_QDRANT_HTTP_PORT:-6333}:6333"
      - "${KIRAKIRA_QDRANT_GRPC_PORT:-6334}:6334"

  neo4j:
    ports:
      - "${KIRAKIRA_NEO4J_BOLT_PORT:-7687}:7687"
      - "${KIRAKIRA_NEO4J_HTTP_PORT:-7474}:7474"

  minio:
    ports:
      - "${KIRAKIRA_MINIO_API_PORT:-9000}:9000"
      - "${KIRAKIRA_MINIO_CONSOLE_PORT:-9001}:9001"

  kirakirad:
    ports:
      - "${KIRAKIRA_KIRAKIRAD_HEALTH_PORT:-8181}:8181"
      - "${KIRAKIRA_KIRAKIRAD_PDP_PORT:-17777}:17777"
