schema_version = 1
workspace_name = "test-workspace"
trust = "trusted"

[model]
default = "test-model"
fallback = "test-model"

[output]
default = "human"
exec_default = "json"

[approvals]
mode = "ask"

[skills]
discover = [".kirakira/skills"]

[orchestration]
handoff_mode = "tool"
max_concurrency = 4
default_subagent_turns = 32
subagent_context = "filtered"
trace_handoffs = true

[deep_research]
enabled = false
max_depth = 3
max_breadth = 4
max_tool_calls = 24
require_citations = true
source_policy = "hybrid"
workspace_dir = ".kirakira/research"

[runtime]
default_profile = "container"

[[runtime.profiles]]
name = "container"
mode = "container"
compose_profiles = ["cli"]
env_files = [".env"]
workspace_root_env = "KIRAKIRA_WORKSPACE_ROOT"

[[runtime.profiles.services]]
name = "postgres"
url_env = "DATABASE_URL"
required = true

[presentation.web]
enabled = false
dev_url_env = "KIRAKIRA_WEB_URL"
api_base_url_env = "KIRAKIRA_API_BASE_URL"

[presentation.desktop]
enabled = false
web_url_env = "KIRAKIRA_WEB_URL"
preload_contract = "strict-ipc"

[compat]
read_claude = true
read_cursor = true
