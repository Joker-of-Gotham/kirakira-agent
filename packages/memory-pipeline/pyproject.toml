[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kirakira-memory-pipeline"
version = "0.1.0"
description = "ML/NLP workers for Kirakira agent memory: episode segmentation, entity extraction, embedding, materialization"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "redis[hiredis]>=5.2.0",
  "qdrant-client>=1.13.0",
  "neo4j>=5.28.0",
  "openai>=1.60.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "tiktoken>=0.8.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
kirakira-memory-pipeline-worker = "kirakira_memory_pipeline.worker:main"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/kirakira_memory_pipeline", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../test/unit/memory-pipeline"]
