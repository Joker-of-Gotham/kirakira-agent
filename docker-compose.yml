name: kirakira-agent

x-kirakira-runtime: &kirakira-runtime
  image: kirakira-agent-runtime:local
  build:
    context: .
    args:
      KIRAKIRA_SOURCE_HASH: ${KIRAKIRA_SOURCE_HASH:-dev}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${KIRAKIRA_POSTGRES_USER:-kirakira}
      POSTGRES_PASSWORD: ${KIRAKIRA_POSTGRES_PASSWORD:-kirakira}
      POSTGRES_DB: ${KIRAKIRA_POSTGRES_DB:-kirakira}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -lc ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${KIRAKIRA_NEO4J_AUTH:-neo4j/testpassword}
      KIRAKIRA_NEO4J_USER: ${KIRAKIRA_NEO4J_USER:-neo4j}
      KIRAKIRA_NEO4J_PASSWORD: ${KIRAKIRA_NEO4J_PASSWORD:-testpassword}
    expose:
      - "7687"
      - "7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${KIRAKIRA_NEO4J_USER}\" -p \"$${KIRAKIRA_NEO4J_PASSWORD}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${KIRAKIRA_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${KIRAKIRA_MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kirakirad:
    <<: *kirakira-runtime
    entrypoint: ["kirakirad"]
    command:
      - "--bundle"
      - "/workspace/policies"
      - "--addr"
      - ":17777"
      - "--health-port"
      - "8181"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - kirakira-home:/root/.kirakira
    expose:
      - "8181"
      - "17777"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8181/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  kirakira-agent:
    <<: *kirakira-runtime
    profiles:
      - cli
    env_file:
      - .env
    environment:
      KIRAKIRA_WORKSPACE_ROOT: /workspace
      KIRAKIRA_PDP_ENDPOINT: tcp://kirakirad:17777
      KIRAKIRA_POLICY_BUNDLE: /workspace/policies
      FORCE_COLOR: "3"
      COLORTERM: truecolor
      TERM: xterm-256color
      DATABASE_URL: ${DATABASE_URL:-postgres://kirakira:kirakira@postgres:5432/kirakira}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${KIRAKIRA_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${KIRAKIRA_NEO4J_PASSWORD:-testpassword}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - kirakira-home:/root/.kirakira
    stdin_open: true
    tty: true
    depends_on:
      kirakirad:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  neo4j-data:
  minio-data:
  kirakira-home:
