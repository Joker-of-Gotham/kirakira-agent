schema_version = 1
workspace_name = "260503_FG_Construct_V4"
trust = "ask"

[ui]
theme = "default"
vim_mode = false
show_trace_ids = false

[output]
default = "human"
exec_default = "json"

[approvals]
mode = "ask"
auto_run_readonly = false

[sandbox]
mode = "container"
network = "restricted"

[skills]
discover = [ ".kirakira/skills", ".claude/skills", ".agents/skills", ".cursor/skills", ".cursor/commands" ]

[mcp]
config_files = [ ".mcp.json", ".cursor/mcp.json" ]

[orchestration]
handoff_mode = "tool"
max_concurrency = 4
default_subagent_turns = 32
subagent_context = "filtered"
trace_handoffs = true
subagent_system_preamble = "Operate as a bounded specialist subagent. Stay within the delegated scope, use only granted tools and skills, and return concise evidence-backed results."

[deep_research]
enabled = false
max_depth = 3
max_breadth = 4
max_tool_calls = 24
require_citations = true
source_policy = "hybrid"
workspace_dir = ".kirakira/research"

[runtime]
default_profile = "container"

[[runtime.profiles]]
name = "container"
mode = "container"
compose_profiles = [ "cli" ]
env_files = [ ".env" ]
workspace_root_env = "KIRAKIRA_WORKSPACE_ROOT"

[[runtime.profiles.services]]
name = "postgres"
url_env = "DATABASE_URL"
required = true

[[runtime.profiles.services]]
name = "redis"
url_env = "REDIS_URL"
required = true

[[runtime.profiles.services]]
name = "qdrant"
url_env = "QDRANT_URL"
required = true

[[runtime.profiles.services]]
name = "neo4j"
url_env = "NEO4J_URI"
required = true

[[runtime.profiles.services]]
name = "minio"
url_env = "S3_ENDPOINT"
required = true

[[runtime.profiles.services]]
name = "kirakirad"
url_env = "KIRAKIRA_PDP_ENDPOINT"
required = true

[[runtime.profiles]]
name = "host"
mode = "host"
env_files = [ ".env" ]
workspace_root_env = "KIRAKIRA_WORKSPACE_ROOT"

[[runtime.profiles.services]]
name = "kirakirad"
url_env = "KIRAKIRA_PDP_ENDPOINT"
required = false

[presentation.web]
enabled = false
dev_url_env = "KIRAKIRA_WEB_URL"
api_base_url_env = "KIRAKIRA_API_BASE_URL"

[presentation.desktop]
enabled = false
web_url_env = "KIRAKIRA_WEB_URL"
preload_contract = "strict-ipc"

[compat]
read_claude = true
read_codex = true
read_cursor = true
read_copilot = true
read_gemini = true

[telemetry]
mode = "off"
otel = false
